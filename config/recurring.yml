# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

default: &default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Heartbeat only - GithubIngestJob's own self-rescheduling is the real pacing (see
  # docs/DESIGN.md "Continuous Ingestion"). This just re-enqueues the chain if it ever
  # died from an unhandled error; ensure_running is a no-op while the chain is healthy.
  github_ingest_heartbeat:
    command: "GithubIngestJob.ensure_running"
    schedule: every hour

# docker-compose runs the jobs service with RAILS_ENV=development, so these need to
# apply there too, not just production.
development:
  <<: *default

production:
  <<: *default
